name: Publish app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build app (relative base)
        run: npm run build
        env:
          PAGES_BASE: ./
      - name: Assemble site
        run: |
          mkdir -p _site/app
          cp -R landing/. _site/
          cp -R dist/. _site/app/
          touch _site/.nojekyll
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387
        with:
          ssh-private-key: ${{ secrets.SITE_SSH_KEY }}
      - name: Trust github.com
        run: |
          mkdir -p ~/.ssh
          curl -fsSL https://api.github.com/meta | jq -r '.ssh_keys[]' >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Publish to site repo
        run: |
          git clone --depth 1 git@github.com:michael-borck/knotebook-site.git site
          rm -rf site/assets site/icons site/app
          rm -f \
            site/index.html \
            site/manifest.webmanifest \
            site/sw.js \
            site/favicon.svg \
            site/icons.svg \
            site/catalogue.json \
            site/sample.knotebook.json \
            site/.nojekyll
          cp -R _site/. site/
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "deploy: ${GITHUB_SHA::7}"
            git push
          else
            echo "No changes to publish."
          fi
